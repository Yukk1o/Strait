plugins:
  - id: router-yaml
    type: router
  - id: adapter-openai
    type: adapter
  - id: auth-static-token
    type: authenticator
    config:
      token: sk-admin-init
      subject: admin
  - id: adapter-ollama
    type: adapter
  - id: prompt-injector
    type: preprocessor
    config:
      system_prompt: "You are a helpful assistant."