name: Release

on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build binaries
        run: |
          GOOS=linux GOARCH=amd64 go build -o build/strait-linux-amd64 ./cmd/strait/
          GOOS=linux GOARCH=arm64 go build -o build/strait-linux-arm64 ./cmd/strait/
          GOOS=darwin GOARCH=amd64 go build -o build/strait-darwin-amd64 ./cmd/strait/
          GOOS=darwin GOARCH=arm64 go build -o build/strait-darwin-arm64 ./cmd/strait/
          GOOS=windows GOARCH=amd64 go build -o build/strait-windows-amd64.exe ./cmd/strait/
          GOOS=windows GOARCH=arm64 go build -o build/strait-windows-arm64.exe ./cmd/strait/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: "Strait ${{ github.ref_name }}"
          files: build/*
          generate_release_notes: true
